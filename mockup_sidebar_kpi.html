<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Georgia:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F5F0E8;
  --ink: #1A1410;
  --ink-muted: #807060;
  --accent: #C0392B;
  --surface2: #EDE6D9;
  --mono: "IBM Plex Mono", monospace;
  --serif: "Georgia", serif;
}

body {
  background: var(--bg);
  padding: 40px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: var(--mono);
}

/* Sidebar Simulation Container */
.sidebar-simulation {
  width: 320px;
  background: #F5F0E8;
  padding: 20px;
  border: 1px solid #D8D0C0;
}

.detail-metrics {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}

/* ─── EXISTING SIDEBAR METRIC ─── */
.metric {
  background: var(--surface2);
  border-radius: 6px;
  padding: 10px 12px;
  text-align: center;
}
.metric-val {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 700;
  line-height: 1;
  color: var(--ink);
}
.metric-label {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-top: 3px;
}

/* ─── PROPOSED SPLIT SIDEBAR METRIC ─── */
.metric-split {
  grid-column: span 1;
  background: var(--surface2);
  border-radius: 6px;
  padding: 8px 10px;
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.split-nums {
  display: flex;
  justify-content: center;
  gap: 8px;
}

.split-num {
  font-family: var(--serif);
  font-size: 16px; /* Slightly smaller for sidebar grid */
  font-weight: 700;
  color: var(--accent);
}

.split-sources {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 2px;
}

.split-source {
  font-family: var(--mono);
  font-size: 7px; /* Tiny for sidebar attribution */
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink-muted);
  width: 40%;
}

.metric-label-integrated {
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink);
  margin-top: 6px;
  padding-top: 4px;
  border-top: 1px solid rgba(26,20,16,0.1);
}
</style>
</head>
<body>

  <div class="sidebar-simulation">
    <div style="font-family:var(--mono); font-size:10px; margin-bottom:10px; color:var(--ink-muted);">PROVINCE METRICS</div>
    <div class="detail-metrics">
      
      <!-- Normal Metric for comparison -->
      <div class="metric">
        <div class="metric-val">527</div>
        <div class="metric-label">Fatalities</div>
      </div>

      <!-- Proposed Split Metric -->
      <div class="metric-split">
        <div class="split-nums">
          <div class="split-num">120</div>
          <div class="split-num" style="color:#B8860B">85</div>
        </div>
        <div class="split-sources">
          <div class="split-source">ACLED</div>
          <div class="split-source">UCDP</div>
        </div>
        <div class="metric-label-integrated">Total Events</div>
      </div>

    </div>
  </div>

</body>
</html>
